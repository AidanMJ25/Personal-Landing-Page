<style>
  .contact-form {
    max-width: 100%;
    margin: 1.75rem 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: .85rem;
  }

  .contact-form label {
    display: block;
    color: #16312e;
    font-weight: 600;
    margin-top: .25rem;
  }

  .contact-form input,
  .contact-form textarea {
    width: 100%;
    box-sizing: border-box;
    padding: .8rem .95rem;
    border: 1px solid rgba(22, 49, 46, 0.14);
    border-radius: 14px;
    color: #16312e;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: inset 0 1px 2px rgba(22, 49, 46, 0.04);
    font: inherit;
    transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
  }

  .contact-form input:focus,
  .contact-form textarea:focus {
    outline: none;
    border-color: #5bb2a2;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(31, 106, 99, 0.18);
  }

  .contact-form textarea {
    min-height: 220px;
    resize: vertical;
  }

  .contact-form button {
    width: auto;
    align-self: start;
    padding: .8rem 1.2rem;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: #ffffff;
    background: #1f6a63;
    font-weight: 600;
    transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
  }

  .contact-form button:hover,
  .contact-form button:focus-visible {
    outline: none;
    background: #268076;
    box-shadow: 0 12px 28px rgba(31, 106, 99, 0.24);
    transform: translateY(-1px);
  }
</style>

<form class="contact-form" action="https://formspree.io/f/mrbybwzk" method="POST">
   <label for="name">Your Name</label>
  <input id="name" name="name" type="text" autocomplete="name" required>
  
  <label for="email">Your Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>

  <label for="message">Your Message</label>
  <textarea id="message" name="message" required></textarea>

  <input type="hidden" name="_subject" value="New message from your Landing Page contact form">
  <input type="text" name="_gotcha" style="display:none"> 
  <button type="submit" class="button">Send</button>
</form>
