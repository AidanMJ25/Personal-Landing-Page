name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node for PostCSS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PostCSS deps (root)
        run: npm ci || npm i

      # If you did NOT commit the theme, uncomment to fetch it:
      # - name: Get Hermit-V2 theme
      #   run: |
      #     rm -rf themes/hermit-v2
      #     git clone https://github.com/1bl4z3r/hermit-V2.git themes/hermit-v2

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          npx postcss --version   # prove postcss is available
          hugo --minify
          echo "-- CSS refs in public/index.html --"
          grep -n 'rel="stylesheet"' public/index.html || true
          echo "-- List a few built assets --"
          find public -maxdepth 2 -type f | head -n 50

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4