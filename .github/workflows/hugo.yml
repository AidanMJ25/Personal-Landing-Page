name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hugo (extended)
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Ensure theme exists in CI
      - name: Get hermit-v2 theme
        run: |
          rm -rf themes/hermit-v2
          git clone https://github.com/1bl4z3r/hermit-V2.git themes/hermit-v2
          ls -la themes/hermit-v2 | head -n 50

      # PostCSS (some Hermit builds need it)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PostCSS deps (root if present)
        run: |
          if [ -f package.json ]; then npm ci || npm i; fi
          if [ -f themes/hermit-v2/package.json ]; then (cd themes/hermit-v2 && npm ci || npm i); fi

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify
          echo "— stylesheet refs —"
          grep -n 'rel="stylesheet"' public/index.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
