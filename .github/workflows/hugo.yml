name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # ok whether vendored or submodule

      # Install latest Hugo (extended)
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Node for PostCSS
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install PostCSS deps (root)
      - run: npm ci || npm i

      # If you didn't commit the theme, fetch it (KEEP commented if vendored)
      # - run: |
      #     rm -rf themes/hermit-v2
      #     git clone https://github.com/1bl4z3r/hermit-V2.git themes/hermit-v2

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          npx postcss --version
          hugo --minify
          echo "-- CSS refs --"
          grep -n 'rel="stylesheet"' public/index.html || true
          echo "-- Assets under /public --"
          find public -maxdepth 2 -type f | head -n 80

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4